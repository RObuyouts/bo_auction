<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyOuts Auction Slot - Admin Portal (Cloud Sync)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #1f2937;
            --info-color: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 20px; color: #60a5fa; }
        .grid-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-panels { grid-template-columns: 1fr; } }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
        }
        h2 { color: #60a5fa; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 0; font-size: 16px; }
        label { font-size: 13px; color: #9ca3af; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger-color); width: auto; padding: 5px 10px; margin: 0; }
        .btn-success { background-color: var(--success-color); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid var(--border-color); text-align: left; font-size: 13px; }
        th { background-color: #1f2937; }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔒 BuyOuts Auction - Admin Portal (Cloud Sync)</h1>
        <span id="syncStatus" style="font-size: 12px; background: #1f2937; padding: 5px 10px; border-radius: 4px; color: #22c55e;">Connected</span>
    </div>

    <div class="grid-panels">
        <!-- Panel 1: Puppet Fragments -->
        <div class="card">
            <h2>🧩 Puppet Fragments Assignment</h2>
            <label>Dami ng Puppet Fragments:</label>
            <input type="number" id="stockPuppet" min="0" value="4">
            <label>Listahan ng mga IGN (Isang pangalan bawat linya):</label>
            <textarea id="puppetMembers" rows="5" placeholder="Member1&#10;Member2..."></textarea>
            <button class="btn-success" onclick="processPuppet()">I-assign ang Puppet</button>
        </div>

        <!-- Panel 2: Feathers -->
        <div class="card">
            <h2>🪶 Feathers (LnD & TaS) Assignment</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>LnD Stock:</label>
                    <input type="number" id="stockLnD" min="0" value="40">
                </div>
                <div>
                    <label>TaS Stock:</label>
                    <input type="number" id="stockTaS" min="0" value="80">
                </div>
            </div>
            <label>Listahan ng mga IGN (Isang pangalan bawat linya):</label>
            <textarea id="featherMembers" rows="5" placeholder="Member1&#10;Member2..."></textarea>
            <button class="btn-success" onclick="processFeathers()">I-distribute ang Feathers</button>
        </div>
    </div>

    <!-- Master List Table -->
    <div class="card">
        <h2>📋 Master Assignment List (Total Members: <span id="admTotalMembers">0</span>)</h2>
        <button class="btn-danger" style="margin-bottom: 10px;" onclick="clearAllData()">I-clear Lahat ng Data</button>
        <table>
            <thead>
                <tr>
                    <th>Member (IGN)</th>
                    <th>Mga Nakatalagang Slot (Page & Row)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminMasterTable">
                <tr><td colspan="3" style="text-align:center; color:#9ca3af;">Nag-a-load ng data mula sa cloud...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">Coded by xButter Designed by SeiMustDie</div>
</div>

<script>
    const API_KEY = "$2a$10$GFYQ9.g6HJ5DBWF0TS04z.ZZrBx7eEGyxEE/sTQEZVx2U.8p2T00.";
    const BIN_ID = localStorage.getItem('jugjugan_bin_id') || ""; 
    let roster = {};

    async function loadData() {
        if (!BIN_ID) {
            updateUI();
            return;
        }
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            roster = data.record || {};
            updateUI();
        } catch (e) {
            console.error("Error loading data", e);
        }
    }

    async function saveData() {
        document.getElementById('syncStatus').innerText = "Saving...";
        try {
            let url = BIN_ID ? `https://api.jsonbin.io/v3/b/${BIN_ID}` : `https://api.jsonbin.io/v3/b`;
            let method = BIN_ID ? "PUT" : "POST";
            
            let res = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY,
                    ...(BIN_ID ? {} : {'X-Bin-Private': 'false'})
                },
                body: JSON.stringify(roster)
            });
            let data = await res.json();
            if (!BIN_ID && data.metadata && data.metadata.id) {
                localStorage.setItem('jugjugan_bin_id', data.metadata.id);
                window.location.reload();
            }
            document.getElementById('syncStatus').innerText = "Connected";
            document.getElementById('syncStatus').style.color = "#22c55e";
        } catch (e) {
            document.getElementById('syncStatus').innerText = "Sync Failed";
            document.getElementById('syncStatus').style.color = "#ef4444";
        }
    }

    function processPuppet() {
        let stockPuppet = parseInt(document.getElementById('stockPuppet').value) || 0;
        let rawNames = document.getElementById('puppetMembers').value;
        let members = rawNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);

        if (members.length === 0 || stockPuppet <= 0) {
            alert('Maglagay ng stock at kahit isang miyembro para sa Puppet.');
            return;
        }

        for (let i = 0; i < stockPuppet; i++) {
            let targetMember = members[i % members.length];
            let pageNum = Math.floor(i / 4) + 1;
            let rowNum = (i % 4) + 1;

            if (!roster[targetMember]) roster[targetMember] = [];
            let slotText = `Page ${pageNum}, Row ${rowNum} (Puppet Fragment)`;
            if (!roster[targetMember].includes(slotText)) {
                roster[targetMember].push(slotText);
            }
        }

        saveData();
        updateUI();
        alert('Matagumpay na na-assign ang Puppet Fragments!');
    }

    function processFeathers() {
        let stockLnD = parseInt(document.getElementById('stockLnD').value) || 0;
        let stockTaS = parseInt(document.getElementById('stockTaS').value) || 0;
        let rawNames = document.getElementById('featherMembers').value;
        let members = rawNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);

        if (members.length === 0 || (stockLnD <= 0 && stockTaS <= 0)) {
            alert('Maglagay ng stock at kahit isang miyembro para sa Feathers.');
            return;
        }

        let globalIndex = 0;
        function assignFeathersWithRotation(itemName, totalStock) {
            if (totalStock <= 0) return;
            let numMembers = members.length;
            for (let i = 0; i < totalStock; i++) {
                let targetMember = members[i % numMembers];
                let pageNum = Math.floor(globalIndex / 4) + 1;
                let rowNum = (globalIndex % 4) + 1;
                let isExtra = i >= (Math.floor(totalStock / numMembers) * numMembers);
                let labelExtra = isExtra ? ` (${itemName} - Extra/Rotation)` : ` (${itemName})`;
                let slotText = `Page ${pageNum}, Row ${rowNum}${labelExtra}`;

                if (!roster[targetMember]) roster[targetMember] = [];
                if (!roster[targetMember].includes(slotText)) {
                    roster[targetMember].push(slotText);
                }
                globalIndex++;
            }
            if (globalIndex % 4 !== 0) {
                globalIndex += (4 - (globalIndex % 4));
            }
        }

        assignFeathersWithRotation("LND Feather", stockLnD);
        assignFeathersWithRotation("TaS Feather", stockTaS);

        saveData();
        updateUI();
        alert('Na-distribute na ang Feathers!');
    }

    function removeSlot(ign, index) {
        roster[ign].splice(index, 1);
        if (roster[ign].length === 0) delete roster[ign];
        saveData();
        updateUI();
    }

    function clearAllData() {
        if (confirm('Sigurado ka bang gusto mong burahin ang lahat ng assignments?')) {
            roster = {};
            saveData();
            updateUI();
        }
    }

    function updateUI() {
        let tableHTML = '';
        let keys = Object.keys(roster);

        if (keys.length === 0) {
            tableHTML = `<tr><td colspan="3" style="text-align:center; color:#9ca3af;">Wala pang nakatalagang miyembro.</td></tr>`;
        } else {
            keys.forEach((ign) => {
                let slots = roster[ign];
                let slotsHTML = slots.map((s, idx) => `
                    <div style="margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 6px 10px; border-radius: 4px; border: 1px solid #1f2937;">
                        <span>🔹 ${s}</span>
                        <button class="btn-danger" style="font-size:11px; padding:2px 6px;" onclick="removeSlot('${ign}', ${idx})">Burahin</button>
                    </div>
                `).join('');

                tableHTML += `
                    <tr>
                        <td><b>${ign}</b></td>
                        <td>${slotsHTML}</td>
                        <td><button class="btn-danger" onclick="delete roster['${ign}']; saveData(); updateUI();">Alisin Lahat</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('adminMasterTable').innerHTML = tableHTML;
        document.getElementById('admTotalMembers').innerText = keys.length;
    }

    loadData();
</script>

</body>
</html>
