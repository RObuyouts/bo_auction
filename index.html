<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyOuts Auction Slot - Member Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 22px; color: #60a5fa; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 { color: #60a5fa; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 0; font-size: 16px; }
        select {
            width: 100%;
            padding: 10px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .slot-box {
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚔️ BuyOuts Auction Slot - Member Portal</h1>
        <p style="margin: 5px 0 0 0; font-size: 13px; color: #9ca3af;">Hanapin ang iyong In-Game Name (IGN) para makita ang iyong mga nakatalagang slot.</p>
    </div>

    <div class="card">
        <h2>Piliin ang iyong IGN:</h2>
        <select id="memberSelect" onchange="showMySlots()">
            <option value="">-- Naglaload ng mga pangalan... --</option>
        </select>
    </div>

    <div class="card">
        <h2>📋 Ang iyong mga Nakatalagang Slot:</h2>
        <div id="mySlotsContainer">
            <span style="color: #9ca3af; font-size: 13px;">Wala pang napipiling miyembro o naglo-load pa...</span>
        </div>
    </div>

    <div class="footer">Code by xButter Designed by SeiMustDie</div>
</div>

<script>
    const API_KEY = "$2a$10$GFYQ9.g6HJ5DBWF0TS04z.ZZrBx7eEGyxEE/sTQEZVx2U.8p2T00.";
    const BIN_ID = localStorage.getItem('jugjugan_bin_id') || "";
    let roster = {};

    async function loadData() {
        if (!BIN_ID) {
            document.getElementById('memberSelect').innerHTML = '<option value="">-- Wala pang data na isini-save ng Admin --</option>';
            return;
        }
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            roster = data.record || {};
            initDropdown();
        } catch (e) {
            console.error("Error loading data", e);
        }
    }

    function initDropdown() {
        let select = document.getElementById('memberSelect');
        let keys = Object.keys(roster).sort();
        
        select.innerHTML = '<option value="">-- Piliin ang Pangalan Mo --</option>';
        keys.forEach(ign => {
            let opt = document.createElement('option');
            opt.value = ign;
            opt.textContent = ign;
            select.appendChild(opt);
        });
    }

    function showMySlots() {
        let selectedIgn = document.getElementById('memberSelect').value;
        let container = document.getElementById('mySlotsContainer');

        if (!selectedIgn || !roster[selectedIgn]) {
            container.innerHTML = `<span style="color: #9ca3af; font-size: 13px;">Wala pang nakatalagang slot para sa pangalang ito.</span>`;
            return;
        }

        let slots = roster[selectedIgn];
        let html = '';
        slots.forEach(slot => {
            html += `<div class="slot-box"><span>🔹</span> <b>${slot}</b></div>`;
        });
        container.innerHTML = html;
    }

    loadData();
</script>

</body>
</html>
