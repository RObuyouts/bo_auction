<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyOuts Auction - Member Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1f2937;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 22px; color: #60a5fa; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 { color: #60a5fa; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 0; font-size: 16px; }
        label { font-size: 13px; color: #9ca3af; display: block; margin-bottom: 8px; }
        .search-box { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: var(--accent-hover); }
        .slot-card {
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--success-color);
            padding: 14px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .item-name { font-weight: bold; color: #60a5fa; font-size: 14px; }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚔️ BuyOuts Auction - Member Portal</h1>
        <p style="margin: 5px 0 0 0; font-size: 13px; color: #9ca3af;">I-type ang iyong In-Game Name (IGN) para makita ang iyong mga napanalunang slot.</p>
    </div>

    <div class="card">
        <label>Ilagay ang iyong IGN:</label>
        <div class="search-box">
            <input type="text" id="ignInput" placeholder="Halimbawa: Rene" onkeypress="handleEnter(event)">
            <button onclick="searchMySlots()">Hanapin</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Mga Nakatalagang Slot Mo:</h2>
        <div id="mySlotsContainer">
            <span style="color: #9ca3af; font-size: 13px;">I-type ang iyong IGN sa itaas at pindutin ang Hanapin.</span>
        </div>
    </div>

    <div class="footer">Coded by xButter Designed by SeiMustDie</div>
</div>

<script>
    const API_KEY = "$2a$10$GFYQ9.g6HJ5DBWF0TS04z.ZZrBx7eEGyxEE/sTQEZVx2U.8p2T00.";
    const BIN_ID = "6aaea2dbffd5d1605319a3f9";
    let roster = {};

    async function loadData() {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            roster = data.record || {};
        } catch (e) {
            console.error("Error loading data", e);
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            searchMySlots();
        }
    }

    function searchMySlots() {
        let query = document.getElementById('ignInput').value.trim().toLowerCase();
        let container = document.getElementById('mySlotsContainer');

        if (!query) {
            container.innerHTML = `<span style="color: #ef4444; font-size: 13px;">Mangyaring maglagay ng IGN.</span>`;
            return;
        }

        let foundKey = Object.keys(roster).find(k => k.toLowerCase() === query);

        if (!foundKey || !roster[foundKey] || roster[foundKey].length === 0) {
            container.innerHTML = `<span style="color: #9ca3af; font-size: 13px;">Walang nakitang slot o maling IGN para sa "<b>${document.getElementById('ignInput').value}</b>". Subukang ulitin.</span>`;
            return;
        }

        let slots = roster[foundKey];
        let html = `<div style="font-size: 13px; color: #9ca3af; margin-bottom: 10px;">Resulta para kay: <b style="color:#fff;">${foundKey}</b></div>`;
        
        slots.forEach(slot => {
            html += `
                <div class="slot-card">
                    <span class="item-name">🔹 ${slot}</span>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    loadData();
</script>

</body>
</html>
